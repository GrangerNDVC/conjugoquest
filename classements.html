<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 Salle des Légendes — Conjugo Quest</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --gold:    #fbbf24;
            --gold2:   #f59e0b;
            --dark:    #06060f;
            --navy:    #0d0d2b;
            --brown:   #8B4513;
            --brown2:  #5c2d0a;
            --text:    #e8d5b0;
            --muted:   #7a6a50;
        }

        body {
            background: var(--dark);
            color: var(--text);
            font-family: 'Cinzel', serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── BACKGROUND ── */
        .bg-scene {
            position: fixed; inset: 0; z-index: 0;
            background: linear-gradient(180deg, #06060f 0%, #0d0a1e 40%, #1a0a05 100%);
        }
        .bg-scene::before {
            content: '';
            position: absolute; inset: 0;
            background: url('img/backgrounds/01_debut.png') center/cover no-repeat;
            opacity: 0.12;
            filter: saturate(0.3);
        }
        /* Particules dorées */
        .sparks { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
        .spark {
            position: absolute;
            width: 2px; height: 2px;
            background: var(--gold);
            border-radius: 50%;
            animation: sparkFloat linear infinite;
            opacity: 0;
        }

        @keyframes sparkFloat {
            0%   { transform: translateY(100vh) translateX(0);   opacity: 0; }
            10%  { opacity: 0.8; }
            90%  { opacity: 0.4; }
            100% { transform: translateY(-20px) translateX(40px); opacity: 0; }
        }

        /* ── LAYOUT ── */
        .container {
            position: relative; z-index: 2;
            max-width: 900px;
            margin: 0 auto;
            padding: 30px 20px 60px;
        }

        /* ── HEADER ── */
        .hall-header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }
        .hall-header .hero-left,
        .hall-header .hero-right {
            position: absolute;
            bottom: -10px;
            width: 110px;
            filter: drop-shadow(0 0 15px rgba(251,191,36,0.4));
        }
        .hall-header .hero-left  { left: 0;  transform: scaleX(1); }
        .hall-header .hero-right { right: 0; transform: scaleX(-1); }

        .hall-title {
            font-family: 'Cinzel Decorative', serif;
            font-size: clamp(1.4em, 4vw, 2.4em);
            color: var(--gold);
            text-shadow: 0 0 30px rgba(251,191,36,0.5), 0 2px 4px rgba(0,0,0,0.8);
            letter-spacing: 0.05em;
            line-height: 1.2;
            animation: titleGlow 3s ease-in-out infinite alternate;
        }
        @keyframes titleGlow {
            from { text-shadow: 0 0 20px rgba(251,191,36,0.3), 0 2px 4px rgba(0,0,0,0.8); }
            to   { text-shadow: 0 0 50px rgba(251,191,36,0.7), 0 2px 4px rgba(0,0,0,0.8); }
        }
        .hall-subtitle {
            color: var(--muted);
            font-size: 0.75em;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-top: 6px;
        }
        .divider {
            width: 260px; height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 12px auto;
        }

        /* ── TABS ── */
        .tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }
        .tab {
            padding: 9px 22px;
            background: rgba(139,69,19,0.15);
            border: 1px solid rgba(139,69,19,0.5);
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            font-size: 0.8em;
            color: var(--muted);
            transition: all 0.25s;
            letter-spacing: 0.05em;
        }
        .tab:hover { border-color: var(--gold2); color: var(--gold2); }
        .tab.active {
            background: rgba(251,191,36,0.12);
            border-color: var(--gold);
            color: var(--gold);
            box-shadow: 0 0 15px rgba(251,191,36,0.15);
        }

        /* ── PANEL ── */
        .panel { display: none; }
        .panel.active { display: block; animation: fadeUp 0.35s ease-out; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── LEVEL SELECT ── */
        .level-select {
            width: 100%;
            background: rgba(10,10,20,0.8);
            border: 1px solid var(--brown);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text);
            font-family: 'Cinzel', serif;
            font-size: 0.8em;
            margin-bottom: 22px;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }
        .level-select:focus { border-color: var(--gold); }

        /* ── TABLE ── */
        .leaderboard {
            background: rgba(6,6,15,0.7);
            border: 1px solid rgba(139,69,19,0.4);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(251,191,36,0.1);
        }
        .leaderboard table { width: 100%; border-collapse: collapse; }
        .leaderboard thead tr {
            background: linear-gradient(90deg, rgba(139,69,19,0.3), rgba(251,191,36,0.1), rgba(139,69,19,0.3));
            border-bottom: 1px solid rgba(251,191,36,0.3);
        }
        .leaderboard th {
            padding: 12px 16px;
            font-size: 0.7em;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--gold);
            text-align: left;
        }
        .leaderboard td {
            padding: 11px 16px;
            font-size: 0.82em;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            color: var(--text);
        }
        .leaderboard tbody tr { transition: background 0.15s; }
        .leaderboard tbody tr:hover { background: rgba(251,191,36,0.04); }
        .leaderboard tbody tr:last-child td { border-bottom: none; }

        /* Rangs */
        .rank-cell { display: flex; align-items: center; gap: 10px; }
        .rank-badge {
            width: 28px; height: 28px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.85em; font-weight: 700; flex-shrink: 0;
        }
        .rank-1 .rank-badge { background: linear-gradient(135deg,#ffd700,#b8860b); color: #000; box-shadow: 0 0 10px rgba(255,215,0,0.5); }
        .rank-2 .rank-badge { background: linear-gradient(135deg,#c0c0c0,#808080); color: #000; }
        .rank-3 .rank-badge { background: linear-gradient(135deg,#cd7f32,#8b4513); color: #fff; }
        .rank-other .rank-badge { background: rgba(255,255,255,0.07); color: var(--muted); }
        .my-row td { background: rgba(251,191,36,0.06) !important; }
        .my-row td:first-child { border-left: 2px solid var(--gold); }

        /* Barre de progression aventure */
        .progress-bar-wrap {
            display: flex; align-items: center; gap: 8px;
        }
        .progress-bar {
            height: 6px; border-radius: 3px;
            background: rgba(255,255,255,0.08);
            flex: 1; overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--gold2), var(--gold));
            border-radius: 3px;
            transition: width 0.8s ease;
        }
        .progress-label { font-size: 0.75em; color: var(--muted); white-space: nowrap; }

        /* Stats duel */
        .stat-win  { color: #4ade80; font-weight: 600; }
        .stat-loss { color: #f87171; font-weight: 600; }
        .stat-bar  {
            display: flex; gap: 4px; align-items: center; height: 6px; width: 80px;
        }
        .stat-w { background: #4ade80; border-radius: 2px; height: 100%; }
        .stat-l { background: #f87171; border-radius: 2px; height: 100%; }

        /* ── LOADING ── */
        .loading {
            text-align: center; padding: 50px 20px;
            color: var(--muted); font-size: 0.85em;
        }
        .loading::after {
            content: ''; display: block;
            width: 32px; height: 32px;
            border: 2px solid rgba(251,191,36,0.2);
            border-top-color: var(--gold);
            border-radius: 50%;
            margin: 16px auto 0;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .empty { text-align: center; padding: 40px; color: var(--muted); font-size: 0.85em; }
        .error { text-align: center; padding: 30px; color: #f87171; font-size: 0.82em; }

        /* ── RETOUR ── */
        .btn-retour {
            display: block; width: fit-content;
            margin: 35px auto 0;
            padding: 11px 28px;
            background: rgba(139,69,19,0.2);
            border: 1px solid var(--brown);
            border-radius: 8px;
            color: var(--text);
            font-family: 'Cinzel', serif;
            font-size: 0.8em;
            letter-spacing: 0.06em;
            text-decoration: none;
            transition: all 0.2s;
        }
        .btn-retour:hover { border-color: var(--gold); color: var(--gold); background: rgba(251,191,36,0.08); }

        /* ── TROPHY ICON ── */
        .trophy-img {
            width: 40px; vertical-align: middle;
            filter: drop-shadow(0 0 8px rgba(251,191,36,0.6));
            margin: 0 8px;
        }
    </style>
</head>
<body>

    <div class="bg-scene"></div>

    <!-- Particules -->
    <div class="sparks" id="sparks"></div>

    <div class="container">

        <!-- HEADER -->
        <div class="hall-header">
            <img class="hero-left"  src="img/combat/01_attaque.png"  alt="Héros"  onerror="this.style.display='none'">
            <img class="hero-right" src="img/enemies/01_profil.png"  alt="Gardien" onerror="this.style.display='none'">

            <p class="hall-subtitle">Conjugo Quest</p>
            <div class="divider"></div>
            <h1 class="hall-title">
                <img src="img/recompense01.png" class="trophy-img" onerror="this.style.display='none'" alt="">
                Salle des Légendes
                <img src="img/recompense01.png" class="trophy-img" onerror="this.style.display='none'" alt="">
            </h1>
            <div class="divider"></div>
        </div>

        <!-- TABS -->
        <div class="tabs">
            <button class="tab active" onclick="switchTab('aventure', this)">⚔️ Aventure — Top 10</button>
            <button class="tab" onclick="switchTab('duel', this)">🥊 Mes Duels</button>
        </div>

        <!-- AVENTURE -->
        <div id="panel-aventure" class="panel active">
            <select class="level-select" id="select-niveau" onchange="chargerAventure()">
                <option value="global">🌍 Classement global — tous niveaux</option>
                <option value="1">Niveau 1 — Présent</option>
                <option value="2">Niveau 2 — Passé Composé</option>
                <option value="3">Niveau 3 — Imparfait</option>
                <option value="4">Niveau 4 — Futur</option>
                <option value="5">Niveau 5 — Plus-que-Parfait</option>
                <option value="6">Niveau 6 — Futur Antérieur</option>
                <option value="7">Niveau 7 — Passé Simple</option>
                <option value="8">Niveau 8 — Passé Antérieur</option>
                <option value="9">Niveau 9 — BOSS Indicatif</option>
                <option value="10">Niveau 10 — Impératif Présent</option>
                <option value="11">Niveau 11 — Impératif Passé</option>
                <option value="12">Niveau 12 — BOSS Impératif</option>
                <option value="13">Niveau 13 — Conditionnel Présent</option>
                <option value="14">Niveau 14 — Conditionnel Passé</option>
                <option value="15">Niveau 15 — BOSS Conditionnel</option>
                <option value="16">Niveau 16 — Subjonctif Présent</option>
                <option value="17">Niveau 17 — Subjonctif Passé</option>
                <option value="18">Niveau 18 — Subjonctif Imparfait</option>
                <option value="19">Niveau 19 — BOSS Subjonctif</option>
                <option value="20">Niveau 20 — Voix Passive</option>
                <option value="21">Niveau 21 — BOSS FINAL 🏆</option>
            </select>
            <div id="table-aventure" class="leaderboard">
                <div class="loading">Chargement des légendes</div>
            </div>
        </div>

        <!-- DUEL -->
        <div id="panel-duel" class="panel">
            <div id="table-duel" class="leaderboard">
                <div class="loading">Chargement de tes duels</div>
            </div>
        </div>

        <a href="map.html" class="btn-retour">⬅️ Retour à la carte</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/save-system.js"></script>
    <script>

    // ── PARTICULES ──
    const sparksEl = document.getElementById('sparks');
    for (let i = 0; i < 25; i++) {
        const s = document.createElement('div');
        s.className = 'spark';
        s.style.left = Math.random() * 100 + 'vw';
        s.style.animationDuration = (8 + Math.random() * 12) + 's';
        s.style.animationDelay = (-Math.random() * 15) + 's';
        s.style.width = s.style.height = (1 + Math.random() * 2) + 'px';
        sparksEl.appendChild(s);
    }

    // ── TABS ──
    function switchTab(nom, btn) {
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('panel-' + nom).classList.add('active');
        btn.classList.add('active');
        if (nom === 'aventure') chargerAventure();
        if (nom === 'duel')     chargerDuels();
    }

    const monId     = () => window.SaveSystem ? SaveSystem.getCurrentUserId()     : null;
    const monPseudo = () => window.SaveSystem ? SaveSystem.getCurrentPlayerName() : '?';

    // ── AVENTURE ──
    async function chargerAventure() {
        const div = document.getElementById('table-aventure');
        div.innerHTML = '<div class="loading">Chargement des légendes</div>';
        const niveau = document.getElementById('select-niveau').value;
        const moi = monId();

        try {
            const snap = await window.FirebaseDB.collection('joueurs').get();
            let joueurs = [];
            snap.forEach(doc => {
                const d = doc.data();
                if (!d.pseudo) return;
                const completes = d.progression?.niveauxCompletes || [];
                if (niveau === 'global') {
                    joueurs.push({ id: doc.id, pseudo: d.pseudo, score: completes.length, max: 21 });
                } else {
                    const n = parseInt(niveau);
                    if (completes.includes(n))
                        joueurs.push({ id: doc.id, pseudo: d.pseudo, score: completes.length, max: 21 });
                }
            });

            joueurs.sort((a, b) => b.score - a.score);
            const top = joueurs.slice(0, 10);

            if (top.length === 0) {
                div.innerHTML = '<div class="empty">✨ Aucun héros n\'a encore conquis ce niveau…</div>';
                return;
            }

            let html = '<table><thead><tr><th>Rang</th><th>Héros</th><th>Progression</th></tr></thead><tbody>';
            top.forEach((j, i) => {
                const rankClass = i < 3 ? 'rank-' + (i+1) : 'rank-other';
                const myClass   = j.id === moi ? ' my-row' : '';
                const pct       = Math.round((j.score / j.max) * 100);
                const medal     = i === 0 ? '1' : i === 1 ? '2' : i === 2 ? '3' : (i+1);
                html += `
                <tr class="${rankClass}${myClass}">
                    <td><div class="rank-cell">
                        <div class="rank-badge">${medal}</div>
                        ${j.id === moi ? '<span style="color:var(--gold);font-size:0.75em;">Toi</span>' : ''}
                    </div></td>
                    <td>${j.pseudo}</td>
                    <td><div class="progress-bar-wrap">
                        <div class="progress-bar"><div class="progress-bar-fill" style="width:${pct}%"></div></div>
                        <span class="progress-label">${j.score}/${j.max}</span>
                    </div></td>
                </tr>`;
            });
            html += '</tbody></table>';
            div.innerHTML = html;
        } catch(e) {
            div.innerHTML = '<div class="error">❌ ' + e.message + '</div>';
        }
    }

    // ── DUELS ──
    async function chargerDuels() {
        const div = document.getElementById('table-duel');
        div.innerHTML = '<div class="loading">Chargement de tes duels</div>';
        const moi = monId();
        const pseudo = monPseudo();

        if (!moi) {
            div.innerHTML = '<div class="empty">Connecte-toi pour voir tes duels.</div>';
            return;
        }

        try {
            const [s1, s2] = await Promise.all([
                window.FirebaseDB.collection('duels').where('player1Id', '==', moi).where('statut', '==', 'termine').get(),
                window.FirebaseDB.collection('duels').where('player2Id', '==', moi).where('statut', '==', 'termine').get()
            ]);

            const stats = {};
            const traiter = (doc, p1) => {
                const d = doc.data();
                const adv = p1 ? d.player2Name : d.player1Name;
                if (!adv) return;
                if (!stats[adv]) stats[adv] = { v: 0, d: 0 };
                const gagne = (p1 && d.gagnant === 'player1') || (!p1 && d.gagnant === 'player2');
                if (gagne) stats[adv].v++; else stats[adv].d++;
            };
            s1.forEach(doc => traiter(doc, true));
            s2.forEach(doc => traiter(doc, false));

            const liste = Object.entries(stats).sort((a, b) => b[1].v - a[1].v);

            if (liste.length === 0) {
                div.innerHTML = "<div class=\"empty\">Tu n'as pas encore disputé de duel…<br><small style='color:var(--muted);'>Les duels terminés apparaîtront ici.</small></div>";
                return;
            }

            const total_v = liste.reduce((s,[,x]) => s + x.v, 0);
            const total_d = liste.reduce((s,[,x]) => s + x.d, 0);

            let html = `<table><thead><tr>
                <th>Adversaire</th>
                <th style="text-align:center">✅ Victoires</th>
                <th style="text-align:center">❌ Défaites</th>
                <th>Ratio</th>
            </tr></thead><tbody>`;

            liste.forEach(([adv, s]) => {
                const tot = s.v + s.d;
                const wPct = tot > 0 ? Math.round((s.v/tot)*100) : 0;
                const lPct = 100 - wPct;
                html += `<tr>
                    <td>${adv}</td>
                    <td style="text-align:center" class="stat-win">${s.v}</td>
                    <td style="text-align:center" class="stat-loss">${s.d}</td>
                    <td><div class="stat-bar">
                        <div class="stat-w" style="width:${wPct}%"></div>
                        <div class="stat-l" style="width:${lPct}%"></div>
                    </div></td>
                </tr>`;
            });

            html += `</tbody><tfoot><tr style="border-top:1px solid rgba(251,191,36,0.2)">
                <td style="color:var(--muted);font-size:0.75em;padding:10px 16px;">
                    Total <strong style="color:var(--text)">${pseudo}</strong>
                </td>
                <td style="text-align:center" class="stat-win">${total_v}</td>
                <td style="text-align:center" class="stat-loss">${total_d}</td>
                <td></td>
            </tr></tfoot></table>`;

            div.innerHTML = html;
        } catch(e) {
            div.innerHTML = '<div class="error">❌ ' + e.message + '</div>';
        }
    }

    document.addEventListener('DOMContentLoaded', () => chargerAventure());
    </script>
</body>
</html>
