<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conjugo Quest - Combat</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/combat.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Dancing+Script:wght@400;700&family=MedievalSharp&display=swap" rel="stylesheet">
    <style>
        /* Bouton Quitter (à côté du bouton audio) */
        .btn-quitter {
            position: fixed;
            bottom: 20px;
            right: 80px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(244, 67, 54, 0.2);
            border: 2px solid #f44336;
            color: #f44336;
            font-size: 1.2em;
            cursor: pointer;
            z-index: 1001;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cinzel', serif;
        }

        .btn-quitter:hover {
            background: rgba(244, 67, 54, 0.4);
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(244, 67, 54, 0.5);
        }

        /* Ajustement du bouton audio */
        .audio-toggle {
            right: 20px !important;
        }

        /* Bouton et bulle indice */
        #btn-indice {
            display: none;
            margin: 10px auto 0;
            padding: 6px 18px;
            font-size: 0.85em;
            font-family: 'Cinzel', serif;
            background: rgba(251, 191, 36, 0.15);
            border: 2px solid #fbbf24;
            border-radius: 20px;
            color: #fbbf24;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #btn-indice:hover:not(:disabled) {
            background: rgba(251, 191, 36, 0.3);
            transform: translateY(-1px);
        }

        #btn-indice:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        #indice-conjugaison {
            display: none;
            color: #fbbf24;
            font-style: italic;
            margin-top: 8px;
            font-size: 0.85em;
            max-width: 380px;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div id="combat-container">
        
        <!-- PHASE INTRO -->
        <div id="phase-intro" class="phase active">
            <div id="intro-fond-noir"></div>
            <h2 id="nom-niveau" class="titre-niveau"></h2>
            <div id="tour-intro" class="tour-container">
                <div class="tour-glow"></div>
                <img id="img-tour-intact" src="" alt="Tour">
            </div>
            <div id="ennemi-intro" class="ennemi-container halo-dore">
                <img id="img-ennemi-arrogant" src="" alt="Ennemi">
            </div>
            <div id="dialogue-defi" class="dialogue-box dialogue-bottom"></div>
            <button id="btn-commencer-combat" class="btn-combat" onclick="demarrerCombat()">
                ⚔️ COMMENCER LE COMBAT
            </button>
        </div>
        
        <!-- PHASE COMBAT -->
        <div id="phase-combat" class="phase">
            <img id="background-combat" src="" alt="Background">
            <img id="hero-combat" src="" alt="Héros">
            <div id="barre-vie-tour">
                <div id="vie-tour-actuelle"></div>
            </div>
            <div id="tour-combat">
                <img id="img-tour-etat" src="" alt="Tour">
            </div>
            <div id="ennemi-combat" class="ennemi-combat">
                <img id="img-ennemi-etat" src="" alt="Ennemi">
                <div id="dialogue-ennemi" class="dialogue-box" style="display: none;"></div>
            </div>
            
            <!-- Zone d'attaque -->
            <div id="zone-input-attaque" style="display: none;">
                <div id="info-conjugaison">
                    <span id="verbe-infinitif"></span> - 
                    <span id="temps-verbal"></span> - 
                    <span id="personne-verbal"></span>
                </div>
                <input type="text" id="input-conjugaison" placeholder="Conjugue le verbe..." 
                       spellcheck="false" autocorrect="off" autocapitalize="none" autocomplete="off">

                <!-- Bouton indice -->
                <button id="btn-indice" onclick="afficherIndice()">💡 Indice</button>
                <div id="indice-conjugaison"></div>

                <button id="btn-valider-attaque" onclick="validerAttaque()">
                    🔮 LANCER L'INCANTATION
                </button>
            </div>
            
            <!-- Zone d'incantation -->
            <div id="zone-incantation" style="display: none;">
                <div class="cercle-magique">
                    <div class="ellipse-magique ellipse-1"></div>
                    <div class="ellipse-magique ellipse-2"></div>
                    <div class="ellipse-magique ellipse-3"></div>
                    <div class="ellipse-magique ellipse-4"></div>
                    <div class="particule-magique" style="top: 20%; left: 30%;"></div>
                    <div class="particule-magique" style="top: 60%; left: 70%; animation-delay: 0.5s;"></div>
                    <div class="particule-magique" style="top: 40%; left: 15%; animation-delay: 1s;"></div>
                    <div class="particule-magique" style="top: 80%; left: 50%; animation-delay: 1.5s;"></div>
                    <div class="particule-magique" style="top: 10%; left: 80%; animation-delay: 2s;"></div>
                    <div class="centre-incantation">
                        <div id="incantation-text" class="texte-conjugaison"></div>
                    </div>
                </div>
            </div>
            
            <!-- Zone de défense -->
            <div id="zone-defense" style="display: none;">
                <div id="qcm-container">
                    <h3 id="question-defense"></h3>
                    <div id="reponses-defense"></div>
                </div>
            </div>
            
            <div id="particule-attaque" style="display: none;"></div>
            
            <div id="ui-joueur">
                <div id="vies-joueur">❤️❤️❤️</div>
                <div id="combo-counter" style="display: none;">
                    🔥 Combo: <span id="combo-nombre">0</span>/5
                </div>
            </div>

            <!-- BOUTON QUITTER -->
            <button id="btn-quitter-jeu" class="btn-quitter" onclick="quitterJeu()" style="display: none;">🚪</button>

            <!-- Panneau de contrôle audio -->
            <div id="audio-controls" class="audio-controls" style="display: none;">
                <div class="audio-panel">
                    <h4>🔊 Contrôle audio</h4>
                    <div class="audio-slider">
                        <label>🎵 Musique</label>
                        <input type="range" id="music-volume" min="0" max="100" value="15" oninput="updateMusicVolume(this.value)">
                        <span id="music-volume-value">15%</span>
                    </div>
                    <div class="audio-slider">
                        <label>🔔 Effets</label>
                        <input type="range" id="sfx-volume" min="0" max="100" value="22" oninput="updateSfxVolume(this.value)">
                        <span id="sfx-volume-value">22%</span>
                    </div>
                </div>
            </div>

            <!-- Bouton pour ouvrir/fermer le panneau audio -->
            <button id="audio-toggle" class="audio-toggle" onclick="toggleAudioPanel()">🔊</button>
        </div>
        
        <!-- PHASE VICTOIRE -->
        <div id="phase-victoire" class="phase">
            <div class="victoire-container">
                <img id="img-tour-detruite" src="" alt="Tour détruite">
                <img id="img-ennemi-vaincu" src="" alt="Ennemi vaincu">
                <h2 class="victoire-titre">🏆 VICTOIRE !</h2>
                <p id="message-victoire" class="dialogue-box">Tu as obtenu un nouvel équipement !</p>
                <img id="img-recompense" class="recompense-img" src="" alt="Récompense">
                <button id="btn-retour-carte" class="btn-retour" onclick="retourCarte()">
                    🗺️ RETOUR À LA CARTE
                </button>
            </div>
        </div>
        
        <!-- PHASE DÉFAITE -->
        <div id="phase-defaite" class="phase">
            <div class="defaite-container">
                <img id="img-hero-defaite" src="" alt="Héros vaincu">
                <h2 class="defaite-titre">💀 DÉFAITE...</h2>
                <p id="message-defaite" class="dialogue-box"></p>
                <div class="choix-defaite">
                    <button onclick="recommencerCombat()">🔄 RECOMMENCER</button>
                    <button onclick="retourCarte()">🗺️ RETOUR À LA CARTE</button>
                </div>
            </div>
        </div>
        
    </div>
    
    <!-- NIVEAUX 1-21 -->
    <script src="js/data-niveau-01.js"></script>
    <script src="js/data-niveau-02.js"></script>
    <script src="js/data-niveau-03.js"></script>
    <script src="js/data-niveau-04.js"></script>
    <script src="js/data-niveau-05.js"></script>
    <script src="js/data-niveau-06.js"></script>
    <script src="js/data-niveau-07.js"></script>
    <script src="js/data-niveau-08.js"></script>
    <script src="js/data-niveau-09.js"></script>
    <script src="js/data-niveau-10.js"></script>
    <script src="js/data-niveau-11.js"></script>
    <script src="js/data-niveau-12.js"></script>
    <script src="js/data-niveau-13.js"></script>
    <script src="js/data-niveau-14.js"></script>
    <script src="js/data-niveau-15.js"></script>
    <script src="js/data-niveau-16.js"></script>
    <script src="js/data-niveau-17.js"></script>
    <script src="js/data-niveau-18.js"></script>
    <script src="js/data-niveau-19.js"></script>
    <script src="js/data-niveau-20.js"></script>
    <script src="js/data-niveau-21.js"></script>
    
    <!-- CONFIG ET COMBAT -->
    <!-- Firebase CDN -->
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/visual-config.js"></script>
    <script src="js/save-system.js"></script>
    <script src="js/combat.js"></script>
</body>
</html>
