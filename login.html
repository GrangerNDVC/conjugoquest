<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conjugo Quest - Déconnexion</title>
    <link rel="stylesheet" href="css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cinzel', serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        
        .logout-container {
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #fbbf24;
            border-radius: 20px;
            padding: 50px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        
        h1 {
            color: #fbbf24;
            font-size: 2.5em;
            margin-bottom: 30px;
        }
        
        p {
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 1.2em;
        }
        
        .btn-retour {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(145deg, #fbbf24, #f59e0b);
            border: none;
            border-radius: 8px;
            color: #1a1a2e;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 1.2em;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s;
        }
        
        .btn-retour:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(251, 191, 36, 0.5);
        }
    </style>
</head>
<body>
    <div class="logout-container">
        <h1>🚪 Déconnexion</h1>
        <p>Tu as été déconnecté.<br>Ta progression a été sauvegardée.</p>
        <a href="index.html" class="btn-retour">⬅️ Retour à l'accueil</a>
    </div>
    <script>
        // Nettoyer la session
        sessionStorage.clear();
    </script>
</body>
</html>
