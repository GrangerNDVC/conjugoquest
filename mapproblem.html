<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conjugo Quest - Carte du Monde</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/map.css">
</head>
<body>
    <!-- Musique de fond -->
    <audio id="bg-music" loop autoplay>
        <source src="audio/map-music.mp3" type="audio/mpeg">
        Votre navigateur ne supporte pas la musique.
    </audio>
    
    <div id="carte-container">
        <!-- Plateau avec toutes les tours -->
        <div id="plateau">
            <!-- Les tours seront générées en JavaScript -->
        </div>
        
        <!-- Héros chibi -->
        <img id="hero-chibi" src="img/map/hero_chibi.png" alt="Héros" onerror="this.src='img/default-hero.png'">
        
        <!-- Interface utilisateur -->
        <div id="map-ui">
            <div class="ui-top">
                <h2>🗺️ Conjugo Quest - Aventure</h2>
                <div class="stats">
                    <span id="niveau-actuel">Niveau: <span id="niveau">1</span>/21</span>
                    <span id="vies-hero">❤️❤️❤️</span>
                </div>
            </div>
            
            <button id="btn-retour-menu" onclick="retourMenu()">
                🏠 Retour au Menu
            </button>
        </div>
    </div>

    <!-- Contrôle musique -->
    <button id="music-toggle" onclick="toggleMusic()">🔊</button>

    <script>
        // Fonction pour retourner au menu
        function retourMenu() {
            window.location.href = 'index.html'; // ou votre page de menu
        }

        // Gestion de la musique
        function toggleMusic() {
            const music = document.getElementById('bg-music');
            const btn = document.getElementById('music-toggle');
            if (music.paused) {
                music.play();
                btn.textContent = '🔊';
            } else {
                music.pause();
                btn.textContent = '🔈';
            }
        }

        // Tentative de lecture automatique (souvent bloquée par les navigateurs)
        window.addEventListener('load', function() {
            const music = document.getElementById('bg-music');
            music.volume = 0.5; // Volume à 50%
            music.play().catch(e => {
                console.log("Lecture automatique bloquée, cliquez sur le bouton musique");
                document.getElementById('music-toggle').textContent = '🔈';
            });
        });
    </script>

    <script src="js/map.js"></script>
</body>
</html>
